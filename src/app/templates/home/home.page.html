<main class="page-content" aria-labelledby="home-title">
  <p class="eyebrow">{{ i18n.translate('appName') }}</p>
  <h1 id="home-title">{{ i18n.translate('homeTitle') }}</h1>
  <p>{{ i18n.translate('homeDescription') }}</p>

  <div class="page-actions">
    <button type="button" (click)="count.update(n => n + 1)">
      {{ i18n.translate('counterLabel') }}: {{ count() }}
    </button>
    <a routerLink="/customers">{{ i18n.translate('customersLink') }}</a>
  </div>
</main>

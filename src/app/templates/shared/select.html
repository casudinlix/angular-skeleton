<select [id]="controlId()" [value]="value()" [disabled]="disabled()"
  [attr.aria-describedby]="describedBy()" (change)="change($event)" (blur)="touched()"
  class="app-touch-target w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-base text-slate-900 focus:border-brand-600 disabled:opacity-50 dark:border-slate-700 dark:bg-slate-900 dark:text-white">
  @if (placeholder()) {
    <option value="" disabled>{{ placeholder() }}</option>
  }
  @for (item of options(); track item.value) {
    <option [value]="item.value">{{ item.label }}</option>
  }
</select>

<nav aria-label="Breadcrumb" class="mb-4 min-w-0 text-xs">
  <ol class="flex min-w-0 flex-wrap items-center gap-2 text-slate-500 dark:text-slate-400">
    @for (item of items(); track $index) {
      <li class="flex min-w-0 items-center gap-2">
        @if (!$first) { <span aria-hidden="true">/</span> }
        @if (item.url) {
          <a [routerLink]="item.url" class="rounded hover:text-brand-700 focus-visible:underline dark:hover:text-brand-400">{{ item.label }}</a>
        } @else {
          <span aria-current="page" class="app-break-anywhere font-semibold text-slate-900 dark:text-slate-100">{{ item.label }}</span>
        }
      </li>
    }
  </ol>
</nav>

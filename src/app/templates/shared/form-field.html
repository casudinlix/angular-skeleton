<div class="min-w-0">
  <label [attr.for]="controlId()" class="mb-1.5 block text-xs font-semibold text-slate-700 dark:text-slate-200">
    {{ label() }}
    @if (required()) { <span aria-hidden="true" class="text-red-600">*</span> }
  </label>
  <ng-content />
  @if (error()) {
    <p role="alert" [id]="controlId() + '-error'" class="mt-1.5 text-xs text-red-700 dark:text-red-300">{{ error() }}</p>
  } @else if (hint()) {
    <p [id]="controlId() + '-hint'" class="mt-1.5 text-xs text-slate-500 dark:text-slate-400">{{ hint() }}</p>
  }
</div>

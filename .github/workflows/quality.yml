name: Quality
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - run: npm run i18n:check
      - run: npm run structure:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Check feature generator
        run: |
          npm run generate:feature -- generated-check
          npm run i18n:check
          npm run structure:check
          npm run check
      - name: Check Angular schematic
        run: npx ng generate ./tools/schematics:feature --name=sample-module --dry-run --defaults
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

name: Generate Lockfile Once
on:
  push:
    branches: [feat/enterprise-angular-foundation]
    paths:
      - '.github/workflows/lockfile-once.yml'
permissions:
  contents: write
jobs:
  generate-lock:
    if: github.repository == 'casudinlix/angular-skeleton' && github.ref == 'refs/heads/feat/enterprise-angular-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/enterprise-angular-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Resolve without executing dependency scripts
        run: |
          set -e
          npm install --global npm@11.19.1
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to authorized feature branch only
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: generate npm lockfile using npm 11"
            git push origin HEAD:refs/heads/feat/enterprise-angular-foundation
          fi
